<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starfleet Warp Arcade 3D</title>
    <!-- Tailwind CSS for Modern HUD -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Orbitron', sans-serif; 
            overflow: hidden; 
            background: #000; 
            margin: 0; 
            user-select: none; 
            touch-action: none; 
            -webkit-touch-callout: none;
        }
        .hud-glass { background: rgba(10, 20, 40, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(0, 170, 255, 0.3); box-shadow: 0 0 20px rgba(0, 170, 255, 0.2); }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HUD Overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full max-w-6xl mx-auto">
            <div class="hud-glass px-4 py-2 sm:px-6 sm:py-3 rounded-xl flex items-center space-x-4 sm:space-x-6 text-cyan-400">
                <div>
                    <p class="text-[10px] sm:text-xs text-cyan-300/75 tracking-widest">SHIELDS</p>
                    <div class="w-24 sm:w-32 bg-slate-800 h-2.5 sm:h-3 rounded-full overflow-hidden mt-1 border border-cyan-500/40">
                        <div id="shield-bar" class="bg-cyan-400 h-full w-full transition-all duration-300 shadow-[0_0_10px_#00aaff]"></div>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] sm:text-xs text-cyan-300/75 tracking-widest">SCORE</p>
                    <p id="score-val" class="text-xl sm:text-2xl font-black text-white">000000</p>
                </div>
            </div>

            <div class="hud-glass px-4 py-2 sm:px-6 sm:py-3 rounded-xl text-center text-cyan-400">
                <p class="text-[10px] sm:text-xs text-cyan-300/75 tracking-widest">WARP</p>
                <p id="warp-val" class="text-xl sm:text-2xl font-black text-yellow-400">WARP 1</p>
            </div>
        </div>

        <!-- Bottom Notification -->
        <div class="text-center pb-2 flex flex-col items-center">
            <p class="text-cyan-400/60 text-[10px] sm:text-xs tracking-widest">DRAG SCREEN TO STEER | TAP TO FIRE</p>
        </div>
    </div>

    <!-- Start / Game Over Overlay Modal -->
    <div id="menu-screen" class="absolute inset-0 z-20 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 pointer-events-auto">
        <div class="hud-glass p-6 sm:p-8 rounded-2xl max-w-md w-full border border-cyan-500/50">
            <h1 class="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2 tracking-wider">STARFLEET ASSAULT</h1>
            <p class="text-cyan-200/70 text-xs sm:text-sm mb-6">Command the USS Enterprise through hostile asteroid fields and rogue drone sectors.</p>
            
            <div id="final-score-container" class="hidden mb-6">
                <p class="text-xs text-cyan-300/70">MISSION REPORT - FINAL SCORE</p>
                <p id="final-score" class="text-3xl font-bold text-yellow-400">0</p>
            </div>

            <button id="start-btn" class="w-full py-3.5 sm:py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black rounded-xl tracking-widest shadow-[0_0_25px_rgba(0,170,255,0.6)] transition-all cursor-pointer">
                ENGAGE WARP DRIVE
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // --- THREE.JS GAME SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- TEXTURE LOADER FOR CUSTOM UPLOAD ---
        const textureLoader = new THREE.TextureLoader();
        const hullTexture = textureLoader.load('enterprise.png', 
            (texture) => { console.log("Hull texture loaded successfully!"); }, 
            undefined, 
            (err) => { console.warn("Texture load failed, falling back to default material colors.", err); }
        );

        // --- PROCEDURAL USS ENTE
        function createEnterprise() {
            const group = new THREE.Group();
            
            // Materials using the uploaded custom texture map
            const hullMat = new THREE.MeshStandardMaterial({ 
                map: hullTexture, 
                color: 0xdddddd, 
                roughness: 0.3, 
                metalness: 0.8 
            });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5, metalness: 0.5 });
            const nacelleBodyMat = new THREE.MeshStandardMaterial({ map: hullTexture, color: 0xcccccc, roughness: 0.4, metalness: 0.7 });
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
            const bussardMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
            const deflectorMat = new THREE.MeshBasicMaterial({ color: 0xff7700 });

            // 1. Saucer Section
            const saucerGeo = new THREE.CylinderGeometry(2.2, 2.0, 0.25, 32);
            const saucer = new THREE.Mesh(saucerGeo, hullMat);
            saucer.position.set(0, 0, -1);
            group.add(saucer);

            // Bridge Module
            const bridgeGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.15, 16);
            const bridge = new THREE.Mesh(bridgeGeo, darkMat);
            bridge.position.set(0, 0.15, -1);
            group.add(bridge);

            // 2. Engineering Hull (Secondary Hull)
            const engGeo = new THREE.CylinderGeometry(0.6, 0.7, 4.0, 16);
            engGeo.rotateX(Math.PI / 2);
            const engineeringHull = new THREE.Mesh(engGeo, hullMat);
            engineeringHull.position.set(0, -0.5, 1.0);
            group.add(engineeringHull);

            // Deflector Dish
            const deflectorGeo = new THREE.ConeGeometry(0.4, 0.3, 16);
            deflectorGeo.rotateX(-Math.PI / 2);
            const deflector = new THREE.Mesh(deflectorGeo, deflectorMat);
            deflector.position.set(0, -0.5, -1.0);
            group.add(deflector);

            // 3. Connecting Neck
            const neckGeo = new THREE.BoxGeometry(0.35, 1.0, 1.2);
            const neck = new THREE.Mesh(neckGeo, hullMat);
            neck.position.set(0, -0.25, 0.1);
            neck.rotation.x = -0.2;
            group.add(neck);

            // 4. Warp Pylons
            const pylonGeo = new THREE.BoxGeometry(2.4, 0.15, 1.0);
            const pylon = new THREE.Mesh(pylonGeo, hullMat);
            pylon.position.set(0, -0.1, 1.8);
            pylon.rotation.z = 0.2;
            group.add(pylon);

            // 5. Warp Nacelles
            const nacelleGeo = new THREE.CylinderGeometry(0.35, 0.35, 3.6, 16);
            nacelleGeo.rotateX(Math.PI / 2);

            const createNacelle = (xPos) => {
                const nacelleGroup = new THREE.Group();
                const body = new THREE.Mesh(nacelleGeo, nacelleBodyMat);
                nacelleGroup.add(body);

                // Glowing warp strip
                const stripGeo = new THREE.BoxGeometry(0.1, 0.12, 2.8);
                const strip = new THREE.Mesh(stripGeo, glowMat);
                strip.position.set(0, 0.3, 0);
                nacelleGroup.add(strip);

                // Bussard Collector (Front Red Cap)
                const bussardGeo = new THREE.SphereGeometry(0.35, 16, 16);
                const bussard = new THREE.Mesh(bussardGeo, bussardMat);
                bussard.position.set(0, 0, -1.8);
                nacelleGroup.add(bussard);

                nacelleGroup.position.set(xPos, 0, 1.8);
                return nacelleGroup;
            };

            group.add(createNacelle(-1.5));
            group.add(createNacelle(1.5));

            group.scale.set(0.65, 0.65, 0.65);
            return group;
        }

        const player = createEnterprise();
        scene.add(player);

        // --- STARFIELD (Realistic Distant Stars) ---
        const starCount = 1200;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 100;
            starPositions[i+1] = (Math.random() - 0.5) * 100;
            starPositions[i+2] = (Math.random() - 0.5) * 250 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.9, sizeAttenuation: true });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- GAME STATE ---
        let gameActive = false;
        let score = 0;
        let shields = 100;
        let warpFactor = 1;
        let lasers = [];
        let enemies = [];
        let targetX = 0, targetY = 0;
        let keys = {};
        let lastShotTime = 0;

        // Mouse Controls
        window.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            targetX = mouseX * 6;
            const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            targetY = mouseY * 4;
        });

        // Touch Controls (Optimized for Mobile)
        window.addEventListener('touchmove', (e) => {
            if (!gameActive || e.touches.length === 0) return;
            const touch = e.touches[0];
            const touchX = (touch.clientX / window.innerWidth) * 2 - 1;
            targetX = touchX * 6;
            const touchY = -(touch.clientY / window.innerHeight) * 2 + 1;
            targetY = touchY * 4;
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            fireLaser();
        }, { passive: true });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameActive) fireLaser();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        window.addEventListener('click', () => { if (gameActive) fireLaser(); });

        function fireLaser() {
            const now = Date.now();
            if (now - lastShotTime < 150) return;
            lastShotTime = now;

            playSound('laser');
            const laserGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8);
            laserGeo.rotateX(Math.PI / 2);
            const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            
            [-0.8, 0.8].forEach(offsetX => {
                const laser = new THREE.Mesh(laserGeo, laserMat);
                laser.position.set(player.position.x + offsetX, player.position.y, player.position.z - 1);
                scene.add(laser);
                lasers.push(laser);
            });
        }

        // Spawn Enemies / Asteroids
        function spawnEnemy() {
            if (!gameActive) return;
            const isDrone = Math.random() > 0.4;
            let geo, mat;

            if (isDrone) {
                geo = new THREE.ConeGeometry(0.6, 1.5, 8);
                geo.rotateX(Math.PI / 2);
                mat = new THREE.MeshStandardMaterial({ color: 0xff2222, metalness: 0.8, roughness: 0.2 });
            } else {
                geo = new THREE.DodecahedronGeometry(Math.random() * 0.8 + 0.6);
                mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
            }

            const enemy = new THREE.Mesh(geo, mat);
            enemy.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8, -100);
            enemy.userData = { rotSpeed: new THREE.Vector3(Math.random()*0.05, Math.random()*0.05, 0) };
            scene.add(enemy);
            enemies.push(enemy);
        }

        setInterval(spawnEnemy, 900);

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Smooth ship movement interpolation
                player.position.x += (targetX - player.position.x) * 0.1;
                player.position.y += (targetY - player.position.y) * 0.1;
                player.rotation.z = (player.position.x - targetX) * -0.05;
                player.rotation.x = (player.position.y - targetY) * 0.05;

                // Keyboard movement fallback
                if (keys['ArrowLeft'] || keys['KeyA']) targetX = Math.max(targetX - 0.2, -6);
                if (keys['ArrowRight'] || keys['KeyD']) targetX = Math.min(targetX + 0.2, 6);
                if (keys['ArrowUp'] || keys['KeyW']) targetY = Math.min(targetY + 0.2, 4);
                if (keys['ArrowDown'] || keys['KeyS']) targetY = Math.max(targetY - 0.2, -4);

                // Progressive Warp Factor
                score += 1;
                warpFactor = Math.floor(score / 500) + 1;
                document.getElementById('score-val').innerText = String(score).padStart(6, '0');
                document.getElementById('warp-val').innerText = `WARP ${warpFactor}`;

                // Move Starfield
                const positions = starGeo.attributes.position.array;
                for (let i = 2; i < positions.length; i += 3) {
                    positions[i] += 0.8 * warpFactor;
                    if (positions[i] > 10) positions[i] = -250;
                }
                starGeo.attributes.position.needsUpdate = true;

                // Move Lasers
                for (let i = lasers.length - 1; i >= 0; i--) {
                    lasers[i].position.z -= 3;
                    if (lasers[i].position.z < -100) {
                        scene.remove(lasers[i]);
                        lasers.splice(i, 1);
                    }
                }

                // Move Enemies & Collisions
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const en = enemies[i];
                    en.position.z += 0.6 + (warpFactor * 0.3);
                    en.rotation.x += en.userData.rotSpeed.x;
                    en.rotation.y += en.userData.rotSpeed.y;

                    // Player Collision
                    if (en.position.distanceTo(player.position) < 1.5) {
                        playSound('explosion');
                        shields -= 25;
                        document.getElementById('shield-bar').style.width = shields + '%';
                        scene.remove(en);
                        enemies.splice(i, 1);

                        if (shields <= 0) {
                            endGame();
                        }
                        continue;
                    }

                    // Laser Collision
                    let destroyed = false;
                    for (let j = lasers.length - 1; j >= 0; j--) {
                        if (en.position.distanceTo(lasers[j].position) < 1.2) {
                            playSound('explosion');
                            score += 150;
                            scene.remove(en);
                            enemies.splice(i, 1);
                            scene.remove(lasers[j]);
                            lasers.splice(j, 1);
                            destroyed = true;
                            break;
                        }
                    }
                    if (destroyed) continue;

                    // Out of bounds
                    if (en.position.z > 10) {
                        scene.remove(en);
                        enemies.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            initAudio();
            score = 0;
            shields = 100;
            warpFactor = 1;
            targetX = 0;
            targetY = 0;
            player.position.set(0, 0, 0);
            document.getElementById('shield-bar').style.width = '100%';
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('final-score-container').classList.add('hidden');

            enemies.forEach(e => scene.remove(e));
            enemies = [];
            lasers.forEach(l => scene.remove(l));
            lasers = [];

            gameActive = true;
        }

        function endGame() {
            gameActive = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-score-container').classList.remove('hidden');
            document.getElementById('start-btn').innerText = 'RE-ENGAGE WARP DRIVE';
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('start-btn').addEventListener('touchend', (e) => {
            e.preventDefault();
            startGame();
        });

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
