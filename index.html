<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starfleet Warp Assault: Resistance is Futile</title>
    <!-- Tailwind CSS for Modern HUD -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Orbitron', sans-serif; overflow: hidden; background: #000; margin: 0; user-select: none; touch-action: none; -webkit-touch-callout: none; }
        .hud-glass { background: rgba(10, 20, 40, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 170, 255, 0.4); box-shadow: 0 0 20px rgba(0, 170, 255, 0.25); }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HUD Overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 sm:p-6">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full max-w-6xl mx-auto gap-2">
            <!-- Shields & Score -->
            <div class="hud-glass px-3 py-2 sm:px-5 sm:py-3 rounded-xl flex items-center space-x-3 sm:space-x-5 text-cyan-400">
                <div>
                    <p class="text-[9px] sm:text-xs text-cyan-300/75 tracking-widest">SHIELDS</p>
                    <div class="w-20 sm:w-28 bg-slate-800 h-2 sm:h-2.5 rounded-full overflow-hidden mt-1 border border-cyan-500/40">
                        <div id="shield-bar" class="bg-cyan-400 h-full w-full transition-all duration-300 shadow-[0_0_10px_#00aaff]"></div>
                    </div>
                </div>
                <div>
                    <p class="text-[9px] sm:text-xs text-cyan-300/75 tracking-widest">SCORE</p>
                    <p id="score-val" class="text-base sm:text-xl font-black text-white">000000</p>
                </div>
            </div>

            <!-- Mission Progress / Sector Objective -->
            <div class="hud-glass px-3 py-2 sm:px-5 sm:py-3 rounded-xl text-center text-cyan-400 flex-1 max-w-[200px] sm:max-w-xs mx-2">
                <p id="objective-title" class="text-[9px] sm:text-xs text-cyan-300/75 tracking-widest truncate">MISSION PROGRESS</p>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-1 border border-cyan-500/40">
                    <div id="mission-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300 shadow-[0_0_10px_#ffaa00]"></div>
                </div>
            </div>

            <!-- Warp Status -->
            <div class="hud-glass px-3 py-2 sm:px-5 sm:py-3 rounded-xl text-center text-cyan-400">
                <p id="warp-title" class="text-[9px] sm:text-xs text-cyan-300/75 tracking-widest">WARP</p>
                <p id="warp-val" class="text-base sm:text-xl font-black text-yellow-400">ENGAGED</p>
            </div>
        </div>

        <!-- Boss Health Bar -->
        <div id="boss-hud" class="w-full max-w-sm mx-auto hidden pointer-events-auto text-center px-4">
            <p class="text-[10px] sm:text-xs text-red-400 font-bold tracking-widest mb-1 shadow-[0_0_5px_rgba(255,0,0,0.8)]">WARNING: BORG CUBE INTERCEPTED</p>
            <div class="w-full bg-slate-900 h-2.5 sm:h-3 rounded-full overflow-hidden border border-red-500/60 shadow-[0_0_15px_rgba(255,0,0,0.5)]">
                <div id="boss-health-bar" class="bg-red-600 h-full w-full transition-all duration-150"></div>
            </div>
        </div>

        <!-- Powerup HUD -->
        <div id="powerup-hud" class="w-full max-w-xs mx-auto text-center hidden mb-2">
            <p class="text-xs text-yellow-400 font-black tracking-widest">RAPID FIRE ACTIVE!</p>
        </div>

        <!-- Bottom Notification -->
        <div class="text-center pb-2 flex flex-col items-center">
            <p class="text-cyan-400/60 text-[9px] sm:text-xs tracking-widest">DRAG ANYWHERE TO STEER | TAP TO FIRE</p>
        </div>
    </div>

    <!-- Start / Game Over Overlay Modal -->
    <div id="menu-screen" class="absolute inset-0 z-25 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 pointer-events-auto">
        <div class="hud-glass p-6 sm:p-8 rounded-2xl max-w-md w-full border border-cyan-500/50">
            <h1 id="menu-title" class="text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2 tracking-wider">STARFLEET ASSAULT</h1>
            <p id="menu-desc" class="text-cyan-200/70 text-xs sm:text-sm mb-6">Sector 1 objective: Navigate to the subspace rendezvous point and defeat any threats.</p>
            
            <div id="final-score-container" class="hidden mb-6">
                <p class="text-xs text-cyan-300/70">MISSION REPORT - FINAL SCORE</p>
                <p id="final-score" class="text-3xl font-bold text-yellow-400">0</p>
            </div>

            <button id="start-btn" class="w-full py-3.5 sm:py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black rounded-xl tracking-widest shadow-[0_0_25px_rgba(0,170,255,0.6)] transition-all cursor-pointer">
                ENGAGE WARP DRIVE
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // --- AUDIO SYSTEM ---
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            if (type === 'laser') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15); gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
            else if (type === 'explosion') { osc.type = 'square'; osc.frequency.setValueAtTime(120, now); osc.frequency.linearRampToValueAtTime(30, now + 0.4); gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
            else if (type === 'powerup') { osc.type = 'sine'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.1); osc.frequency.exponentialRampToValueAtTime(1320, now + 0.2); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'victory') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554.37, now + 0.2); osc.frequency.setValueAtTime(659.25, now + 0.4); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.8); osc.start(now); osc.stop(now + 0.8); }
        }

        // --- THREE.JS GAME SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); scene.add(ambientLight);
        const playerGroup = new THREE.Group(); scene.add(playerGroup);

        let material1 = null, material2 = null, centerTexture = null, topTexture = null, midTopTexture = null, midBottomTexture = null, bottomTexture = null;
        let defaultTexture = new THREE.CanvasTexture(document.createElement('canvas')); // Safe fallback

        function loadTransparentTexture(url, callback) {
            const img = new Image(); img.crossOrigin = 'anonymous';
            img.onload = () => {
                const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) { if (data[i] < 25 && data[i+1] < 25 && data[i+2] < 25) { data[i+3] = 0; } }
                ctx.putImageData(imgData, 0, 0); const texture = new THREE.CanvasTexture(canvas);
                texture.generateMipmaps = true; texture.minFilter = THREE.LinearMipmapLinearFilter; callback(texture);
            };
            img.onerror = () => { console.warn("Could not load: " + url + ", using fallback."); callback(null); }; img.src = url;
        }

        // Setup ship meshes immediately with fallbacks so it never blocks
        const shipGeo = new THREE.PlaneGeometry(3.6, 1.6);
        material1 = new THREE.MeshBasicMaterial({ map: defaultTexture, transparent: true, opacity: 1.0, side: THREE.DoubleSide });
        material2 = new THREE.MeshBasicMaterial({ map: defaultTexture, transparent: true, opacity: 0.0, side: THREE.DoubleSide });
        playerGroup.add(new THREE.Mesh(shipGeo, material1));
        const m2 = new THREE.Mesh(shipGeo, material2); m2.position.z = 0.001; playerGroup.add(m2);

        // Load textures asynchronously
        loadTransparentTexture('ship.png', (tex) => { if(tex) { centerTexture = tex; material1.map = tex; material1.needsUpdate = true; } });
        loadTransparentTexture('ship top.png', (tex) => { topTexture = tex || centerTexture; });
        loadTransparentTexture('ship mid-top.png', (tex) => { midTopTexture = tex || centerTexture; });
        loadTransparentTexture('ship mid-bottom.png', (tex) => { midBottomTexture = tex || centerTexture; });
        loadTransparentTexture('ship bottom.png', (tex) => { bottomTexture = tex || centerTexture; });

        let borgTexture = null;
        loadTransparentTexture('borg_cube.png', (tex) => { borgTexture = tex; });

        // --- MULTICOLOR WARP STAR STREAKS SYSTEM ---
        const starCount = 800;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 6);
        const starColors = new Float32Array(starCount * 6);
        const colors = [ new THREE.Color(0xffffff), new THREE.Color(0x99ffff), new THREE.Color(0xffffcc) ];

        for(let i = 0; i < starCount * 6; i += 6) {
            const x = (Math.random() - 0.5) * 120;
            const y = (Math.random() - 0.5) * 120;
            const z = (Math.random() - 0.5) * 300 - 50;
            starPositions[i] = x; starPositions[i+1] = y; starPositions[i+2] = z;
            starPositions[i+3] = x; starPositions[i+4] = y; starPositions[i+5] = z - 2;

            const baseColor = colors[Math.floor(Math.random() * colors.length)];
            starColors[i] = baseColor.r; starColors[i+1] = baseColor.g; starColors[i+2] = baseColor.b;
            starColors[i+3] = baseColor.r; starColors[i+4] = baseColor.g; starColors[i+5] = baseColor.b;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.8 });
        const starField = new THREE.LineSegments(starGeo, starMat);
        scene.add(starField);

        // --- GAME STATE ---
        let gameActive = false, score = 0, shields = 100, warpFactor = 1, missionProgress = 0, sectorCount = 1;
        let bossActive = false, boss = null, bossHealth = 100;
        let rapidFireActive = false, rapidFireTimer = 0;
        let lasers = [], enemies = [], powerups = [];
        let targetX = 0, targetY = 0, keys = {}, lastShotTime = 0;
        let touchStartX = 0, touchStartY = 0, shipStartX = 0, shipStartY = 0;

        window.addEventListener('mousemove', (e) => { if (!gameActive) return; const mouseX = (e.clientX / window.innerWidth) * 2 - 1; targetX = mouseX * 6; const mouseY = -(e.clientY / window.innerHeight) * 2 + 1; targetY = mouseY * 4; });
        window.addEventListener('touchstart', (e) => { if (!gameActive) return; if (e.touches.length > 0) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; shipStartX = targetX; shipStartY = targetY; } fireLaser(); }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (!gameActive || e.touches.length === 0) return; const touch = e.touches[0]; const deltaX = (touch.clientX - touchStartX) * 0.025; const deltaY = (touch.clientY - touchStartY) * 0.025; targetX = THREE.MathUtils.clamp(shipStartX + deltaX, -6, 6); targetY = THREE.MathUtils.clamp(shipStartY - deltaY, -3.5, 3.5); }, { passive: true });
        window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space' && gameActive) fireLaser(); });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        window.addEventListener('click', () => { if (gameActive) fireLaser(); });

        function fireLaser() {
            const now = Date.now();
            if (now - lastShotTime < (rapidFireActive ? 50 : 150)) return;
            lastShotTime = now; playSound('laser');
            const laserGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 8); laserGeo.rotateX(Math.PI / 2);
            const laserMat = new THREE.MeshBasicMaterial({ color: (rapidFireActive ? 0xffff00 : 0x00ffff) });
            [-1.0, 1.0].forEach(offsetX => { const laser = new THREE.Mesh(laserGeo, laserMat); laser.position.set(playerGroup.position.x + offsetX, playerGroup.position.y, playerGroup.position.z - 1); scene.add(laser); lasers.push(laser); });
        }

        function spawnEnemy() { if (!gameActive || bossActive) return;
            const enemy = Math.random() > 0.4 ? new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0xff2222, metalness: 0.8 })) : new THREE.Mesh(new THREE.DodecahedronGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 }));
            if (enemy.geometry.type === "ConeGeometry") enemy.geometry.rotateX(Math.PI / 2);
            enemy.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8, -100); enemy.userData = { rotSpeed: new THREE.Vector3(Math.random()*0.05, Math.random()*0.05, 0) }; scene.add(enemy); enemies.push(enemy);
        }
        setInterval(spawnEnemy, 900);

        function spawnPowerup(pos, type) {
            const mat = new THREE.MeshStandardMaterial({ color: (type === 'shield' ? 0x00ffff : 0xffff00), transparent: true, opacity: 0.9, emissive: (type === 'shield' ? 0x00ffff : 0xffff00), emissiveIntensity: 0.5 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); p.position.copy(pos); p.userData = { type: type }; scene.add(p); powerups.push(p);
        }

        function spawnBoss() {
            bossActive = true; missionProgress = 100;
            document.getElementById('boss-hud').classList.remove('hidden');
            document.getElementById('objective-title').innerText = "OBJECTIVE: DESTROY THE BORG CUBE";
            document.getElementById('objective-title').classList.add('text-red-400');
            document.getElementById('warp-val').innerText = "DISENGAGED";
            document.getElementById('warp-val').classList.add('text-red-500');

            const bossMat = borgTexture ? new THREE.MeshStandardMaterial({ map: borgTexture, metalness: 0.2, roughness: 0.9 }) : new THREE.MeshStandardMaterial({ color: 0x228833, wireframe: true });
            boss = new THREE.Mesh(new THREE.BoxGeometry(15, 15, 15), bossMat);
            boss.position.set(0, 0, -120); scene.add(boss);
        }

        function sectorComplete() {
            bossActive = false; bossHealth = 100; missionProgress = 0; sectorCount += 1;
            document.getElementById('boss-hud').classList.add('hidden');
            document.getElementById('boss-health-bar').style.width = '100%';
            document.getElementById('objective-title').innerText = "SECTOR " + sectorCount + " PROGRESS";
            document.getElementById('objective-title').classList.remove('text-red-400');
            document.getElementById('warp-val').innerText = "ENGAGED";
            document.getElementById('warp-val').classList.remove('text-red-500');
            document.getElementById('menu-desc').innerText = "Sector " + sectorCount + " objective: Subspace interference detected. Defeat any Borg flagship forces.";
            rapidFireActive = false; rapidFireTimer = 0; document.getElementById('powerup-hud').classList.add('hidden');
            playSound('victory'); score += 2500;
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (gameActive) {
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.1;
                playerGroup.position.y += (targetY - playerGroup.position.y) * 0.1;
                playerGroup.rotation.z = (playerGroup.position.x - targetX) * -0.05;

                // Ship Angle Blending Logic
                if (centerTexture && topTexture && midTopTexture && midBottomTexture && bottomTexture) {
                    const y = playerGroup.position.y; let texA = centerTexture, texB = centerTexture, mix = 0, targetTilt = 0;
                    if (y <= -2.5) { texA = topTexture; mix = 0; targetTilt = -0.4; } 
                    else if (y > -2.5 && y <= -1.5) { texA = topTexture; texB = midTopTexture; mix = (y - (-2.5)) / (-1.5 - (-2.5)); targetTilt = THREE.MathUtils.lerp(-0.4, -0.2, mix); } 
                    else if (y > -1.5 && y <= -0.5) { texA = midTopTexture; texB = centerTexture; mix = (y - (-1.5)) / (-0.5 - (-1.5)); targetTilt = THREE.MathUtils.lerp(-0.2, 0, mix); } 
                    else if (y > -0.5 && y <= 1.8) { texA = centerTexture; texB = centerTexture; mix = 0; targetTilt = 0; } 
                    else if (y > 1.8 && y <= 2.6) { texA = centerTexture; texB = midBottomTexture; mix = (y - 1.8) / (2.6 - 1.8); targetTilt = THREE.MathUtils.lerp(0, 0.15, mix); } 
                    else if (y > 2.6 && y <= 3.2) { texA = midBottomTexture; texB = bottomTexture; mix = (y - 2.6) / (3.2 - 2.6); targetTilt = THREE.MathUtils.lerp(0.15, 0.35, mix); } 
                    else { texA = bottomTexture; mix = 0; targetTilt = 0.35; }
                    material1.map = texA; material2.map = texB; material1.opacity = 1.0 - mix; material2.opacity = mix; material1.needsUpdate = true; material2.needsUpdate = true;
                    playerGroup.rotation.x += (targetTilt - playerGroup.rotation.x) * 0.15;
                }

                if (keys['ArrowLeft'] || keys['KeyA']) targetX = Math.max(targetX - 0.2, -6);
                if (keys['ArrowRight'] || keys['KeyD']) targetX = Math.min(targetX + 0.2, 6);
                if (keys['ArrowUp'] || keys['KeyW']) targetY = Math.min(targetY + 0.2, 4);
                if (keys['ArrowDown'] || keys['KeyS']) targetY = Math.max(targetY - 0.2, -4);

                let speed = 0.6;
                if (!bossActive) {
                    missionProgress += (0.05 + (sectorCount * 0.01));
                    warpFactor = 1 + (sectorCount - 1) * 3;
                    if (missionProgress >= 100) spawnBoss();
                    
                    const streakLength = 1.5 + (warpFactor * 0.8); speed = 0.6 + (warpFactor * 0.4);
                    const positions = starGeo.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 6) {
                        positions[i+2] += speed; positions[i+5] = positions[i+2] - streakLength;
                        if (positions[i+2] > 15) { const rx = (Math.random() - 0.5) * 120, ry = (Math.random() - 0.5) * 120, rz = -250; positions[i] = rx; positions[i+1] = ry; positions[i+2] = rz; positions[i+3] = rx; positions[i+4] = ry; positions[i+5] = rz - streakLength; }
                    }
                } else {
                    const positions = starGeo.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 6) { positions[i+5] = positions[i+2] - 0.5; }
                }
                document.getElementById('mission-bar').style.width = missionProgress + '%';
                starGeo.attributes.position.needsUpdate = true;

                score += (bossActive ? 5 : 1);
                document.getElementById('score-val').innerText = String(score).padStart(6, '0');

                if (rapidFireActive) { rapidFireTimer -= 1; if (rapidFireTimer <= 0) { rapidFireActive = false; document.getElementById('powerup-hud').classList.add('hidden'); } }

                if (bossActive && boss) {
                    if (boss.position.z < -25) boss.position.z += 0.4;
                    boss.rotation.y += 0.005; boss.rotation.x += 0.003;
                    if (boss.position.distanceTo(playerGroup.position) < 8.0) { shields -= 50; document.getElementById('shield-bar').style.width = shields + '%'; playSound('explosion'); if (shields <= 0) endGame(); }
                    for (let j = lasers.length - 1; j >= 0; j--) {
                        if (boss.position.distanceTo(lasers[j].position) < 8.0) { playSound('explosion'); bossHealth -= (rapidFireActive ? 2 : 1); document.getElementById('boss-health-bar').style.width = bossHealth + '%'; scene.remove(lasers[j]); lasers.splice(j, 1); if (bossHealth <= 0) { scene.remove(boss); boss = null; sectorComplete(); } break; }
                    }
                }

                for (let i = lasers.length - 1; i >= 0; i--) { lasers[i].position.z -= 3; if (lasers[i].position.z < -100) { scene.remove(lasers[i]); lasers.splice(i, 1); } }

                for (let i = powerups.length - 1; i >= 0; i--) { const p = powerups[i]; p.position.z += speed; p.rotation.y += 0.05; if (p.position.distanceTo(playerGroup.position) < 1.8) { playSound('powerup'); score += 500; if (p.userData.type === 'shield') { shields = Math.min(shields + 25, 100); document.getElementById('shield-bar').style.width = shields + '%'; } else if (p.userData.type === 'rapidfire') { rapidFireActive = true; rapidFireTimer = 420; document.getElementById('powerup-hud').classList.remove('hidden'); } scene.remove(p); powerups.splice(i, 1); continue; } if (p.position.z > 10) { scene.remove(p); powerups.splice(i, 1); } }

                for (let i = enemies.length - 1; i >= 0; i--) { const en = enemies[i]; en.position.z += speed + 0.1; en.rotation.x += en.userData.rotSpeed.x; en.rotation.y += en.userData.rotSpeed.y; if (en.position.distanceTo(playerGroup.position) < 1.5) { playSound('explosion'); shields -= 25; document.getElementById('shield-bar').style.width = shields + '%'; scene.remove(en); enemies.splice(i, 1); if (shields <= 0) endGame(); continue; } let destroyed = false; for (let j = lasers.length - 1; j >= 0; j--) { if (en.position.distanceTo(lasers[j].position) < 1.2) { playSound('explosion'); score += 150; if (Math.random() < 0.2) spawnPowerup(en.position, (Math.random() < 0.6 ? 'rapidfire' : 'shield')); scene.remove(en); enemies.splice(i, 1); scene.remove(lasers[j]); lasers.splice(j, 1); destroyed = true; break; } } if (destroyed) continue; if (en.position.z > 10) { scene.remove(en); enemies.splice(i, 1); } }
            }
            renderer.render(scene, camera);
        }

        function startGame() { initAudio(); score = 0; shields = 100; warpFactor = 1; missionProgress = 0; bossActive = false; if (boss) { scene.remove(boss); boss = null; } targetX = 0; targetY = 0; playerGroup.position.set(0, 0, 0); document.getElementById('shield-bar').style.width = '100%'; document.getElementById('mission-bar').style.width = '0%'; document.getElementById('boss-hud').classList.add('hidden'); document.getElementById('menu-screen').classList.add('hidden'); document.getElementById('final-score-container').classList.add('hidden'); enemies.forEach(e => scene.remove(e)); enemies = []; lasers.forEach(l => scene.remove(l)); lasers = []; powerups.forEach(p => scene.remove(p)); powerups = []; gameActive = true; }
        function endGame() { gameActive = false; document.getElementById('final-score').innerText = score; document.getElementById('final-score-container').classList.remove('hidden'); document.getElementById('start-btn').innerText = 'RE-ENGAGE WARP DRIVE'; document.getElementById('menu-screen').classList.remove('hidden'); }
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('start-btn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
</html>
